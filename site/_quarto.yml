project:
  type: website
  # post-render:
  #   - "cp -rnv static/. _site" # source: https://github.com/quarto-dev/quarto-cli/discussions/4162#discussioncomment-4831352

website:
  title: "Emma Kane"
  site-url: https://emmamariannekane.com
  description: "Education Research Analyst. Passionate about using data to improve educational outcomes for Deaf and Hard of Hearing"
  page-navigation: true
  back-to-top-navigation: true
  twitter-card:
    card-style: summary_large_image
  comments: 
    utterances: 
      repo: emk9858-tech/EmmaMKaneWebsite 
      label: utterances
      theme: body-light
      issue-term: title

  navbar:
    tools:
    - icon: github
      href: https://www.github.com/emk9858-tech/EmmaMKaneWebsite
    right:
      - text: About
        aria-label: "About Me"
        href: about/index.qmd
      - text: Projects
        aria-label: "Project Portfolio"
        href: projects/index.qmd 
      - text: Service
        aria-label: "Service"
        href: service/index.qmd
      - text: Publications
        aria-label: "Publications"
        href: publication/index.qmd
      - text: Presentations
        aria-label: "Presentations"
        href: presentation/index.qmd

  
  page-footer:
    left: >-
      &#169; Emma Kane &#8729; Made with [Quarto](https://quarto.org)

format: 
  html:
    theme:
      light:
        - cosmo
        - assets/emma-theme.scss
    code-link: true
    lightbox: true

execute: 
  freeze: auto

